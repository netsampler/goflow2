name: Upload release assets

on:
  workflow_call:
    inputs:
      artifact-pattern:
        required: true
        type: string
      release-id:
        required: true
        type: string
      upload-url:
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    name: Upload assets
    runs-on: ubuntu-latest
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: ${{ inputs.artifact-pattern }}
        merge-multiple: true

    - name: Upload release assets
      uses: actions/github-script@v7
      env:
        RELEASE_ID: ${{ inputs.release-id }}
        UPLOAD_URL: ${{ inputs.upload-url }}
      with:
        script: |
          const { createHash } = require('node:crypto');
          const fs = require('node:fs/promises');
          const path = require('node:path');
          const repo = context.repo;
          const releaseId = Number(process.env.RELEASE_ID);
          const uploadUrl = process.env.UPLOAD_URL;
          const files = (await fs.readdir('dist', { withFileTypes: true })).filter(file => file.isFile());
          if (!files.length) throw new Error('No release assets were downloaded');

          const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
            ...repo,
            release_id: releaseId,
            per_page: 100,
          });
          const existing = new Map(assets.map(asset => [asset.name, asset]));
          for (const { name } of files) {
            const data = await fs.readFile(path.join('dist', name));
            const asset = existing.get(name);
            if (asset) {
              const digest = 'sha256:' + createHash('sha256').update(data).digest('hex');
              if (asset.state === 'uploaded' && asset.digest === digest) {
                core.info(`Already uploaded ${name}`);
                continue;
              }
              await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: asset.id });
            }
            core.info(`Uploading ${name}`);
            await github.rest.repos.uploadReleaseAsset({ url: uploadUrl, name, data });
          }
