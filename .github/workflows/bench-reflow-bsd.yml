name: ReFlow BSD CI benchmark

on:
  push:
    branches: [lspgn/bench-reflow-bsd-cross-build]

permissions:
  contents: read

jobs:
  bsd-baseline:
    name: Baseline / ${{ matrix.os }} ${{ matrix.arch }} / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, openbsd, netbsd]
        arch: [amd64, arm64]
        profile: [platform]
        include:
          - arch: amd64
            vm_arch: x86_64
          - arch: arm64
            vm_arch: aarch64
    env:
      REFLOW_GOOS: ${{ matrix.os }}
      REFLOW_GOARCH: ${{ matrix.arch }}
      REFLOW_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set artifact version
        run: echo "REFLOW_VERSION=$(git describe --abbrev --long HEAD)" >> "$GITHUB_ENV"
      - name: Build inside FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          arch: ${{ matrix.vm_arch }}
          mem: 4096
          cpu: 2
          envs: REFLOW_GOOS REFLOW_GOARCH REFLOW_PROFILE REFLOW_VERSION
          # Go's FreeBSD ARM64 external linker requires GNU ld.bfd for cgo.
          prepare: pkg install -y curl gmake binutils
          run: sh scripts/reflow-bsd-benchmark-baseline.sh
      - name: Build inside OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.8'
          arch: ${{ matrix.vm_arch }}
          mem: 4096
          cpu: 2
          envs: REFLOW_GOOS REFLOW_GOARCH REFLOW_PROFILE REFLOW_VERSION
          prepare: pkg_add curl gmake
          run: sh scripts/reflow-bsd-benchmark-baseline.sh
      - name: Build inside NetBSD
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          release: '10.1'
          arch: ${{ matrix.vm_arch }}
          mem: 4096
          cpu: 2
          envs: REFLOW_GOOS REFLOW_GOARCH REFLOW_PROFILE REFLOW_VERSION
          prepare: /usr/sbin/pkg_add -u curl gmake
          run: sh scripts/reflow-bsd-benchmark-baseline.sh
      - uses: actions/upload-artifact@v6
        with:
          name: baseline-reflow-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.profile }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.manifest.txt
            dist/*.dependencies.txt
          if-no-files-found: error

  bsd-candidate:
    name: Candidate / ${{ matrix.os }} ${{ matrix.arch }} / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, openbsd, netbsd]
        arch: [amd64, arm64]
        profile: [platform, pcap]
        include:
          - arch: amd64
            vm_arch: x86_64
          - arch: arm64
            vm_arch: aarch64
    env:
      REFLOW_GOOS: ${{ matrix.os }}
      REFLOW_GOARCH: ${{ matrix.arch }}
      REFLOW_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set artifact version
        run: echo "REFLOW_VERSION=$(git describe --abbrev --long HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        if: matrix.profile == 'platform'
        with:
          go-version-file: go.mod
      - name: Cross-compile platform binary and tests
        if: matrix.profile == 'platform'
        run: sh scripts/reflow-bsd-build.sh cross-build
      - name: Validate profile inside FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          arch: ${{ matrix.vm_arch }}
          mem: 4096
          cpu: 2
          envs: REFLOW_GOOS REFLOW_GOARCH REFLOW_PROFILE REFLOW_VERSION
          # Go's FreeBSD ARM64 external linker requires GNU ld.bfd for cgo.
          prepare: ${{ matrix.profile == 'pcap' && 'pkg install -y curl gmake binutils' || '' }}
          run: sh scripts/reflow-bsd-build.sh
      - name: Validate profile inside OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.8'
          arch: ${{ matrix.vm_arch }}
          mem: 4096
          cpu: 2
          envs: REFLOW_GOOS REFLOW_GOARCH REFLOW_PROFILE REFLOW_VERSION
          prepare: ${{ matrix.profile == 'pcap' && 'pkg_add curl gmake' || '' }}
          run: sh scripts/reflow-bsd-build.sh
      - name: Validate profile inside NetBSD
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          release: '10.1'
          arch: ${{ matrix.vm_arch }}
          mem: 4096
          cpu: 2
          envs: REFLOW_GOOS REFLOW_GOARCH REFLOW_PROFILE REFLOW_VERSION
          prepare: ${{ matrix.profile == 'pcap' && '/usr/sbin/pkg_add -u curl gmake' || '' }}
          run: sh scripts/reflow-bsd-build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: reflow-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.profile }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.manifest.txt
            dist/*.dependencies.txt
          if-no-files-found: error
