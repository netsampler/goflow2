name: ReFlow

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GHCR_REFLOW_IMAGE: ghcr.io/${{ github.repository_owner }}/reflow
  DOCKERHUB_REFLOW_IMAGE: docker.io/${{ github.repository_owner }}/reflow

jobs:
  linux-build:
    uses: ./.github/workflows/reflow-linux.yml
  platform-build:
    uses: ./.github/workflows/reflow-platforms.yml

  docker:
    permissions:
      contents: read
      packages: write
    name: Package platform Docker image / ${{ matrix.arch }}
    needs: linux-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64/v8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: reflow-linux-${{ matrix.arch }}-platform
          path: dist
      - name: Extract platform binary
        run: |
          mkdir -p dist/docker
          tar -xf dist/reflow-*-linux-${{ matrix.arch }}-platform.tar.gz -C dist/docker --strip-components=1
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin
      - name: Build image
        env:
          REFLOW_ARCH: ${{ matrix.arch }}
          REFLOW_DOCKER_PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "${{ github.event_name }}" == pull_request ]]; then push=--load; else push=--push; fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          DOCKER_SUFFIX="-$REFLOW_ARCH" \
          DOCKER_IMAGE_PREFIXES="docker.io/$owner/reflow ghcr.io/$owner/reflow" \
          DOCKER_CMD="buildx build $push --platform $REFLOW_DOCKER_PLATFORM -f Dockerfile.reflow --build-arg PREBUILT_BINARY=dist/docker/reflow" \
          NAME=reflow DESCRIPTION="ReFlow: encode and decode flow and packet streams" make docker

  manifest:
    permissions:
      contents: read
      packages: write
    name: Publish ReFlow Docker Manifests
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

    - name: Set VERSION for tag builds
      if: startsWith(github.ref, 'refs/tags/')
      run: echo "VERSION=$(git describe --tags --abbrev=0 HEAD)" >> "$GITHUB_ENV"

    - name: Publish manifests (branch)
      if: "!startsWith(github.ref, 'refs/tags/')"
      run: |
        images=("${{ env.DOCKERHUB_REFLOW_IMAGE }}" "${{ env.GHCR_REFLOW_IMAGE }}")
        for image in "${images[@]}"; do
          DOCKER_IMAGE="$image" make docker-manifest
          DOCKER_IMAGE="$image" DOCKER_MANIFEST_TAG=latest make docker-manifest
        done

    - name: Publish manifests (tag)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        images=("${{ env.DOCKERHUB_REFLOW_IMAGE }}" "${{ env.GHCR_REFLOW_IMAGE }}")
        for image in "${images[@]}"; do
          DOCKER_IMAGE="$image" DOCKER_MANIFEST_TAG="${VERSION}" make docker-manifest
          DOCKER_IMAGE="$image" DOCKER_MANIFEST_TAG=latest make docker-manifest
        done

  release:
    name: Publish ReFlow Release Assets
    needs: [linux-build, platform-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download ReFlow artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: reflow-*
        merge-multiple: true

    - name: Create or find release
      id: release
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const tag = process.env.GITHUB_REF_NAME;
          async function getRelease() {
            const { data } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            return data;
          }
          try {
            const release = await getRelease();
            core.setOutput('upload_url', release.upload_url);
            core.setOutput('release_id', release.id);
          } catch (error) {
            if (error.status !== 404) throw error;
            try {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Release ${tag}`,
                draft: false,
                prerelease: false,
              });
              core.setOutput('upload_url', data.upload_url);
              core.setOutput('release_id', data.id);
            } catch (createError) {
              if (createError.status !== 422) throw createError;
              const release = await getRelease();
              core.setOutput('upload_url', release.upload_url);
              core.setOutput('release_id', release.id);
            }
          }

    - name: Upload release assets
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs').promises;
          const path = require('path');
          const uploadUrl = '${{ steps.release.outputs.upload_url }}';
          const releaseId = Number('${{ steps.release.outputs.release_id }}');
          const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: releaseId,
            per_page: 100,
          });
          const existing = new Map(assets.map((asset) => [asset.name, asset.id]));
          for (const file of await fs.readdir('./dist')) {
            const fullPath = path.join('./dist', file);
            if (!(await fs.stat(fullPath)).isFile()) continue;
            if (existing.has(file)) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.get(file),
              });
            }
            console.log('uploading', file);
            await github.rest.repos.uploadReleaseAsset({
              url: uploadUrl,
              name: file,
              data: await fs.readFile(fullPath),
            });
          }
