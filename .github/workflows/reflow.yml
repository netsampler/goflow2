name: ReFlow

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: reflow-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref_type == 'tag' && github.ref || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GHCR_REFLOW_IMAGE: ghcr.io/${{ github.repository_owner }}/reflow
  DOCKERHUB_REFLOW_IMAGE: docker.io/${{ github.repository_owner }}/reflow

jobs:
  linux-docker-build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    uses: ./.github/workflows/reflow-linux.yml
    with:
      arch: ${{ matrix.arch }}
      profile: platform
  linux-build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armv7]
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["platform","pcap"]' || '["platform","pcap","dpdk"]') }}
        exclude:
          - arch: amd64
            profile: platform
          - arch: arm64
            profile: platform
          - arch: armv7
            profile: dpdk
          - arch: arm64
            profile: ${{ github.event_name == 'pull_request' && 'pcap' || '' }}
          - arch: armv7
            profile: ${{ github.event_name == 'pull_request' && 'pcap' || '' }}
    uses: ./.github/workflows/reflow-linux.yml
    with:
      arch: ${{ matrix.arch }}
      profile: ${{ matrix.profile }}
  profile-changes:
    name: Check capture profile paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      dpdk: ${{ steps.changes.outputs.dpdk }}
      pcap: ${{ steps.changes.outputs.pcap }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check paths in the PR merge diff
        id: changes
        run: |
          shared_paths=(
            .github/workflows/reflow.yml .github/workflows/reflow-linux.yml
            Makefile go.mod go.sum
            scripts/reflow-build-linux.sh scripts/reflow-verify-profile.py
            cmd/reflow/ pkg/reflow/app/ pkg/reflow/buildprofile/ pkg/reflow/config/
            pkg/reflow/source/capture/ ':(glob)pkg/reflow/source/*.go'
          )
          for profile in dpdk pcap; do
            profile_paths=("pkg/reflow/source/$profile/")
            if [[ "$profile" == pcap ]]; then
              profile_paths+=(.github/workflows/reflow-platforms.yml)
            fi
            changed=$(git diff --name-only --no-renames HEAD^1 HEAD -- "${shared_paths[@]}" "${profile_paths[@]}")
            if [[ -n "$changed" ]]; then
              echo "$profile=true" >> "$GITHUB_OUTPUT"
            else
              echo "$profile=false" >> "$GITHUB_OUTPUT"
            fi
          done
  linux-dpdk-pr:
    needs: profile-changes
    if: needs.profile-changes.outputs.dpdk == 'true'
    uses: ./.github/workflows/reflow-linux.yml
    with:
      arch: amd64
      profile: dpdk
  linux-pcap-pr:
    needs: profile-changes
    if: needs.profile-changes.outputs.pcap == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armv7]
    uses: ./.github/workflows/reflow-linux.yml
    with:
      arch: ${{ matrix.arch }}
      profile: pcap
  platform-build:
    uses: ./.github/workflows/reflow-platforms.yml
  platform-pcap-pr:
    needs: profile-changes
    if: needs.profile-changes.outputs.pcap == 'true'
    uses: ./.github/workflows/reflow-platforms.yml
    with:
      pcap_only: true

  docker:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    name: Package platform Docker image / ${{ matrix.arch }}
    needs: linux-docker-build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: reflow-linux-${{ matrix.arch }}-platform
          path: dist
      - name: Extract platform binary
        run: |
          mkdir -p dist/docker
          tar -xf dist/reflow-*-linux-${{ matrix.arch }}-platform.tar.gz -C dist/docker --strip-components=1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin
      - name: Build image
        env:
          REFLOW_ARCH: ${{ matrix.arch }}
          REFLOW_DOCKER_PLATFORM: ${{ matrix.platform }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          DOCKER_SUFFIX="-$REFLOW_ARCH" \
          DOCKER_IMAGE_PREFIXES="docker.io/$owner/reflow ghcr.io/$owner/reflow" \
          DOCKER_CMD="buildx build --push --platform $REFLOW_DOCKER_PLATFORM -f Dockerfile.reflow --build-arg PREBUILT_BINARY=dist/docker/reflow" \
          NAME=reflow DESCRIPTION="ReFlow: encode and decode flow and packet streams" make docker

  manifest:
    permissions:
      contents: read
      packages: write
    name: Publish ReFlow Docker Manifests
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

    - name: Set VERSION for tag builds
      if: startsWith(github.ref, 'refs/tags/')
      run: echo "VERSION=$(git describe --tags --abbrev=0 HEAD)" >> "$GITHUB_ENV"

    - name: Publish manifests (branch)
      if: "!startsWith(github.ref, 'refs/tags/')"
      run: |
        images=("${{ env.DOCKERHUB_REFLOW_IMAGE }}" "${{ env.GHCR_REFLOW_IMAGE }}")
        for image in "${images[@]}"; do
          DOCKER_IMAGE="$image" make docker-manifest
          DOCKER_IMAGE="$image" DOCKER_MANIFEST_TAG=latest make docker-manifest
        done

    - name: Publish manifests (tag)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        images=("${{ env.DOCKERHUB_REFLOW_IMAGE }}" "${{ env.GHCR_REFLOW_IMAGE }}")
        for image in "${images[@]}"; do
          DOCKER_IMAGE="$image" DOCKER_MANIFEST_TAG="${VERSION}" make docker-manifest
          DOCKER_IMAGE="$image" DOCKER_MANIFEST_TAG=latest make docker-manifest
        done

  collector-build:
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/main.yml
    secrets: inherit

  collector-manifest:
    needs: collector-build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/goflow2-manifest.yml
    secrets: inherit

  release-draft:
    name: Prepare GitHub release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
      upload-url: ${{ steps.release.outputs.upload-url }}
      draft: ${{ steps.release.outputs.draft }}
    steps:
    - name: Find or create draft
      id: release
      uses: actions/github-script@v7
      with:
        script: |
          const repo = context.repo;
          const tag = process.env.GITHUB_REF_NAME;
          let release;
          try {
            ({ data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag }));
          } catch (error) {
            if (error.status !== 404) throw error;
          }

          if (!release) {
            // The tag endpoint only finds published releases. Reuse a draft on reruns.
            const pages = github.paginate.iterator(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            for await (const { data } of pages) {
              release = data.find(candidate => candidate.tag_name === tag);
              if (release) break;
            }
          }

          if (!release) {
            ({ data: release } = await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              name: `Release ${tag}`,
              draft: true,
              prerelease: false,
            }));
          }

          core.setOutput('release-id', release.id);
          core.setOutput('upload-url', release.upload_url);
          core.setOutput('draft', release.draft);

  upload-collector:
    name: Upload GoFlow2 assets
    needs: [release-draft, collector-build]
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      artifact-pattern: dist-*
      release-id: ${{ needs.release-draft.outputs.release-id }}
      upload-url: ${{ needs.release-draft.outputs.upload-url }}

  upload-linux-docker:
    name: Upload ReFlow Linux Docker build assets
    needs: [release-draft, linux-docker-build]
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      artifact-pattern: 'reflow-linux-{amd64,arm64}-platform'
      release-id: ${{ needs.release-draft.outputs.release-id }}
      upload-url: ${{ needs.release-draft.outputs.upload-url }}

  upload-linux:
    name: Upload other ReFlow Linux assets
    needs: [release-draft, linux-build]
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      artifact-pattern: 'reflow-linux-{armv7-platform,*-{pcap,dpdk}}'
      release-id: ${{ needs.release-draft.outputs.release-id }}
      upload-url: ${{ needs.release-draft.outputs.upload-url }}

  upload-platforms:
    name: Upload ReFlow macOS, Windows, and BSD assets
    needs: [release-draft, platform-build]
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      artifact-pattern: 'reflow-{darwin,windows,freebsd,openbsd,netbsd}-*'
      release-id: ${{ needs.release-draft.outputs.release-id }}
      upload-url: ${{ needs.release-draft.outputs.upload-url }}

  release:
    name: Publish GitHub release
    needs: [release-draft, upload-collector, upload-linux-docker, upload-linux, upload-platforms]
    if: needs.release-draft.outputs.draft == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/github-script@v7
      env:
        RELEASE_ID: ${{ needs.release-draft.outputs.release-id }}
      with:
        script: |
          await github.rest.repos.updateRelease({
            ...context.repo,
            release_id: Number(process.env.RELEASE_ID),
            draft: false,
          });
