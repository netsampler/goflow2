name: ReFlow

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Native ARMv7 only: optional full commit SHA already merged into main'
        required: false
        type: string

env:
  GHCR_REFLOW_IMAGE: ghcr.io/${{ github.repository_owner }}/reflow
  DOCKERHUB_REFLOW_IMAGE: docker.io/${{ github.repository_owner }}/reflow

jobs:
  build:
    name: Build ReFlow (${{ matrix.label }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "1"
            libc: musl
            static: "1"
            zig: "1"
            zig_version: 0.15.2
            zig_archive_target: x86_64-linux
            cc: zig cc -target x86_64-linux-musl
            host: x86_64-linux-musl
            apt_packages: make flex bison
            libpcap_source: "1"
            libpcap_version: 1.10.5
            cgo_cflags: -I/tmp/reflow-libpcap/include
            cgo_ldflags: -static -L/tmp/reflow-libpcap/lib
            docker_package: "1"
            docker_platform: linux/amd64
            package: tar
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo: "1"
            libc: musl
            static: "1"
            zig: "1"
            zig_version: 0.15.2
            zig_archive_target: aarch64-linux
            cc: zig cc -target aarch64-linux-musl
            host: aarch64-linux-musl
            apt_packages: make flex bison
            libpcap_source: "1"
            libpcap_version: 1.10.5
            cgo_cflags: -I/tmp/reflow-libpcap/include
            cgo_ldflags: -static -L/tmp/reflow-libpcap/lib
            docker_package: "1"
            docker_platform: linux/arm64/v8
            package: tar
          - &linux-armv7
            label: linux-armv7
            build_tags: ""
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm
            goarm: "7"
            cgo: "1"
            libc: musl
            static: "1"
            zig: "1"
            zig_version: 0.15.2
            zig_archive_target: aarch64-linux
            cc: zig cc -target arm-linux-musleabihf
            host: arm-linux-musleabihf
            apt_packages: make flex bison
            libpcap_source: "1"
            libpcap_version: 1.10.5
            cgo_cflags: -I/tmp/reflow-libpcap/include
            cgo_ldflags: -static -L/tmp/reflow-libpcap/lib
            package: tar
          - label: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            cgo: "1"
            build_tags: reflow_noebpf
            package: tar
          - label: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            cgo: "1"
            build_tags: reflow_noebpf
            package: tar
          - label: windows-amd64
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
            cgo: "1"
            extension: .exe
            package: zip
          - label: windows-arm64
            runner: ubuntu-latest
            goos: windows
            goarch: arm64
            cgo: "1"
            # gopacket/pcap v1.1.19 has generated Windows pcap definitions
            # for 386/amd64 only, so keep this artifact buildable until the
            # dependency supports windows/arm64 pcap.
            build_tags: reflow_nopcap
            extension: .exe
            package: zip
          # Future OpenWrt package architectures, intentionally inactive:
          # x86_64, aarch64_generic, aarch64_cortex-a53, aarch64_cortex-a72,
          # arm_cortex-a7_neon-vfpv4, arm_cortex-a9, arm_cortex-a15_neon-vfpv4,
          # mips_24kc, mipsel_24kc, mipsel_74kc, mipsel_mips32,
          # mips64_octeonplus, riscv64_riscv64.
          # Future EdgeOS/UBNT candidates, intentionally inactive:
          # mips64, mips64le, arm64.
    steps:
    - name: Check out code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: |
          go.sum
          go.mod

    - name: Set VERSION for tag builds
      if: startsWith(github.ref, 'refs/tags/')
      run: echo "VERSION=$(git describe --tags --abbrev=0 HEAD)" >> "$GITHUB_ENV"

    - &install-zig
      name: Install Zig
      if: matrix.zig == '1'
      env:
        ZIG_ARCHIVE_TARGET: ${{ matrix.zig_archive_target }}
        ZIG_VERSION: ${{ matrix.zig_version }}
      run: |
        archive="zig-${ZIG_ARCHIVE_TARGET}-${ZIG_VERSION}"
        curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${archive}.tar.xz" -o /tmp/zig.tar.xz
        tar -C /tmp -xf /tmp/zig.tar.xz
        echo "/tmp/${archive}" >> "$GITHUB_PATH"
        "/tmp/${archive}/zig" version

    - name: Install Linux build dependencies
      if: matrix.goos == 'linux'
      env:
        APT_PACKAGES: ${{ matrix.apt_packages }}
      run: |
        sudo apt-get update
        sudo apt-get install -y $APT_PACKAGES rpm cpio ruby ruby-dev
        gem install --user-install fpm
        echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

    - &build-libpcap
      name: Build static libpcap
      if: matrix.libpcap_source == '1'
      env:
        CC: ${{ matrix.cc }}
        HOST: ${{ matrix.host }}
        LIBPCAP_VERSION: ${{ matrix.libpcap_version }}
      run: |
        prefix=/tmp/reflow-libpcap
        curl -fsSL "https://www.tcpdump.org/release/libpcap-${LIBPCAP_VERSION}.tar.gz" -o /tmp/libpcap.tar.gz
        tar -C /tmp -xzf /tmp/libpcap.tar.gz
        cd "/tmp/libpcap-${LIBPCAP_VERSION}"
        ./configure \
          --host="$HOST" \
          --prefix="$prefix" \
          --with-pcap=linux \
          --disable-shared \
          --disable-dbus \
          --disable-usb \
          --disable-rdma \
          --without-libnl \
          --without-dpdk
        make -j"$(nproc)"
        make install

    - &patch-pcap
      name: Match gopacket pcap timestamp types to libpcap
      if: matrix.libpcap_source == '1'
      run: |
        go mod download github.com/google/gopacket
        module_dir="$(go env GOPATH)/pkg/mod/github.com/google/gopacket@v1.1.19"
        chmod u+w "$module_dir" "$module_dir/pcap" "$module_dir/pcap/pcap_unix.go"
        perl -0pi -e 's{// Windows, Macs, and Linux all use different time types\.  Joy\.\n#ifdef __APPLE__\n#define gopacket_time_secs_t __darwin_time_t\n#define gopacket_time_usecs_t __darwin_suseconds_t\n#elif __ANDROID__\n#define gopacket_time_secs_t __kernel_time_t\n#define gopacket_time_usecs_t __kernel_suseconds_t\n#elif __GLIBC__\n#define gopacket_time_secs_t __time_t\n#define gopacket_time_usecs_t __suseconds_t\n#else  // Some form of linux/bsd/etc\.\.\.\n#include <sys/param.h>\n#ifdef __OpenBSD__\n#define gopacket_time_secs_t u_int32_t\n#define gopacket_time_usecs_t u_int32_t\n#else\n#define gopacket_time_secs_t time_t\n#define gopacket_time_usecs_t suseconds_t\n#endif\n#endif}{// Match libpcap pcap_pkthdr timestamp fields across cross-libc builds.\n#define gopacket_time_secs_t __typeof__(((struct pcap_pkthdr *)0)->ts.tv_sec)\n#define gopacket_time_usecs_t __typeof__(((struct pcap_pkthdr *)0)->ts.tv_usec)}' "$module_dir/pcap/pcap_unix.go"
        if grep -q 'gopacket_time_usecs_t __suseconds_t' "$module_dir/pcap/pcap_unix.go"; then
          echo "failed to patch gopacket pcap time types" >&2
          exit 1
        fi

    - &compile-pcap
      name: Compile pcap source
      if: matrix.cgo == '1'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
        CGO_ENABLED: ${{ matrix.cgo }}
        CC: ${{ matrix.cc }}
        CGO_CFLAGS: ${{ matrix.cgo_cflags }}
        CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
        REFLOW_BUILD_TAGS: ${{ matrix.build_tags }}
      run: |
        output="/tmp/reflow-pcap-${{ matrix.label }}.test"
        if [[ -n "$REFLOW_BUILD_TAGS" ]]; then
          go test -c -tags "$REFLOW_BUILD_TAGS" -o "$output" ./pkg/reflow/source/pcap
        else
          go test -c -o "$output" ./pkg/reflow/source/pcap
        fi

    - name: Package ReFlow
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
        CGO_ENABLED: ${{ matrix.cgo }}
        CC: ${{ matrix.cc }}
        CGO_CFLAGS: ${{ matrix.cgo_cflags }}
        CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
        EXTENSION: ${{ matrix.extension }}
        REFLOW_BUILD_TAGS: ${{ matrix.build_tags }}
      run: |
        if [[ "${{ matrix.package }}" == "zip" ]]; then
          make package-reflow-zip
        elif [[ "$GOOS" == "linux" ]]; then
          make package-reflow-tar package-reflow
          dpkg-deb --info dist/reflow_*.deb
          dpkg-deb --contents dist/reflow_*.deb
          rpm --query --info --package dist/reflow-*.rpm
          rpm --query --list --package dist/reflow-*.rpm
        else
          make package-reflow-tar
        fi

    - name: Verify Linux ReFlow binary
      if: matrix.goos == 'linux'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
        EXTENSION: ${{ matrix.extension }}
        STATIC: ${{ matrix.static }}
      run: |
        output="$(make print-reflow-output)"
        file "$output"
        if [[ "$STATIC" == "1" ]]; then
          file "$output" | grep -F 'statically linked'
          readelf -l "$output" > /tmp/reflow-program-headers.txt
          if grep -q INTERP /tmp/reflow-program-headers.txt; then
            echo "$output must not require a dynamic linker" >&2
            exit 1
          fi
        fi
        archive_dir="$(mktemp -d)"
        deb_dir="$(mktemp -d)"
        rpm_dir="$(mktemp -d)"
        tar -xzf "${output}.tar.gz" -C "$archive_dir"
        dpkg-deb --extract dist/reflow_*.deb "$deb_dir"
        rpm2cpio dist/reflow-*.rpm | (cd "$rpm_dir" && cpio -idm --quiet)
        cmp "$output" "$archive_dir/reflow-package-${{ matrix.label }}/reflow"
        cmp "$output" "$deb_dir/usr/bin/reflow"
        cmp "$output" "$rpm_dir/usr/bin/reflow"

    - name: Verify macOS ReFlow binary
      if: matrix.goos == 'darwin'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        output="$(make print-reflow-output)"
        otool -L "$output" > /tmp/reflow-linked-libraries.txt
        cat /tmp/reflow-linked-libraries.txt
        grep -F libpcap /tmp/reflow-linked-libraries.txt
        go version -m "$output" | grep -F reflow_noebpf
        "$output" -v
        /tmp/reflow-pcap-${{ matrix.label }}.test

    - name: Set ReFlow Docker packaging vars
      if: matrix.docker_package == '1'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
        EXTENSION: ${{ matrix.extension }}
      run: |
        echo "REFLOW_BINARY_PATH=$(make print-reflow-output)" >> "$GITHUB_ENV"

    - name: Set up QEMU
      if: matrix.docker_package == '1'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      if: matrix.docker_package == '1'
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      if: matrix.docker_package == '1' && github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Log in to GHCR
      if: matrix.docker_package == '1' && github.event_name != 'pull_request'
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

    - name: Docker package ReFlow
      if: matrix.docker_package == '1'
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          DOCKER_PUSH_FLAG="--load"
        else
          DOCKER_PUSH_FLAG="--push"
        fi
        DOCKER_SUFFIX=-${{ matrix.goarch }} \
        DOCKER_IMAGE_PREFIXES="${{ env.DOCKERHUB_REFLOW_IMAGE }} ${{ env.GHCR_REFLOW_IMAGE }}" \
        DOCKER_CMD="buildx build $DOCKER_PUSH_FLAG --platform ${{ matrix.docker_platform }} -f Dockerfile.reflow --build-arg BIN_SOURCE=prebuilt --build-arg PREBUILT_BINARY=$REFLOW_BINARY_PATH" \
        NAME=reflow \
        DESCRIPTION="ReFlow: encode and decode flow and packet streams" \
        make docker

    - name: Upload ReFlow artifact
      uses: actions/upload-artifact@v6
      with:
        name: reflow-${{ matrix.label }}
        path: |
          dist/reflow-*.tar.gz
          dist/reflow-*.tar.gz.sha256
          dist/reflow-*.zip
          dist/reflow-*.zip.sha256
          dist/reflow_*.deb
          dist/reflow-*.rpm
        if-no-files-found: error
        retention-days: 14

  native-build:
    name: Build ReFlow native snapshot (${{ matrix.label }})
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - *linux-armv7
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Select the source revision
      id: source
      env:
        SOURCE_REF: ${{ inputs.source_ref }}
      run: |
        if [ -n "$SOURCE_REF" ]; then
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_REF" origin/main
          git checkout --detach "$SOURCE_REF"
        fi
        echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - *install-zig

    - name: Install native build and test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make flex bison qemu-user

    - *build-libpcap
    - *patch-pcap
    - *compile-pcap

    - name: Build the static ARMv7 package
      env:
        CGO_ENABLED: ${{ matrix.cgo }}
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
        CC: ${{ matrix.cc }}
        CGO_CFLAGS: ${{ matrix.cgo_cflags }}
        CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
        VERSION: v${{ steps.source.outputs.revision }}
      run: make package-reflow-tar

    - name: Verify architecture, static linking and ARM execution
      env:
        REVISION: ${{ steps.source.outputs.revision }}
      run: |
        binary="dist/reflow-${REVISION}-linux-armv7"
        file "$binary" | grep -E 'ELF 32-bit LSB.*ARM.*statically linked'
        if readelf -l "$binary" | grep -q INTERP; then
          echo 'The router binary must not require a dynamic linker' >&2
          exit 1
        fi
        qemu-arm -cpu cortex-a9 "$binary" -list-options > /tmp/reflow-options.txt
        grep -q 'ebpf:' /tmp/reflow-options.txt
        qemu-arm -cpu cortex-a9 /tmp/reflow-pcap-linux-armv7.test
        cd dist
        sha256sum -c "reflow-${REVISION}-linux-armv7.tar.gz.sha256"

    - uses: actions/upload-artifact@v6
      with:
        name: reflow-native-armv7-${{ steps.source.outputs.revision }}
        path: |
          dist/reflow-*-linux-armv7.tar.gz
          dist/reflow-*-linux-armv7.tar.gz.sha256
        if-no-files-found: error

  native-publish:
    name: Publish ReFlow native ARMv7 snapshots
    needs: native-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: reflow-native-${{ needs.native-build.outputs.revision }}
      cancel-in-progress: false
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: reflow-native-armv7-${{ needs.native-build.outputs.revision }}
        path: dist

    - name: Publish a durable per-revision native release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        REVISION: ${{ needs.native-build.outputs.revision }}
      run: |
        tag="reflow-${REVISION}"
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release upload "$tag" dist/* --clobber
        else
          gh release create "$tag" dist/* --target "$REVISION" \
            --title "ReFlow ARMv7 ${REVISION:0:12}" \
            --notes "Static Linux ARMv7 / EABI5 ReFlow from ${REVISION}. Includes eBPF and live libpcap capture. Verify the archive against its SHA-256 sidecar before installation." \
            --prerelease --latest=false
        fi

  manifest:
    name: Publish ReFlow Docker Manifests
    needs: build
    if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

    - name: Set VERSION for tag builds
      if: startsWith(github.ref, 'refs/tags/')
      run: echo "VERSION=$(git describe --tags --abbrev=0 HEAD)" >> "$GITHUB_ENV"

    - name: Publish manifests (branch)
      if: "!startsWith(github.ref, 'refs/tags/')"
      run: |
        images=("${{ env.DOCKERHUB_REFLOW_IMAGE }}" "${{ env.GHCR_REFLOW_IMAGE }}")
        for image in "${images[@]}"; do
          DOCKER_IMAGE="$image" make docker-manifest
          DOCKER_IMAGE="$image" DOCKER_MANIFEST_TAG=latest make docker-manifest
        done

    - name: Publish manifests (tag)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        images=("${{ env.DOCKERHUB_REFLOW_IMAGE }}" "${{ env.GHCR_REFLOW_IMAGE }}")
        for image in "${images[@]}"; do
          DOCKER_IMAGE="$image" DOCKER_MANIFEST_TAG="${VERSION}" make docker-manifest
          DOCKER_IMAGE="$image" DOCKER_MANIFEST_TAG=latest make docker-manifest
        done

  release:
    name: Publish ReFlow Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download ReFlow artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: reflow-*
        merge-multiple: true

    - name: Create or find release
      id: release
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const tag = process.env.GITHUB_REF_NAME;
          async function getRelease() {
            const { data } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            return data;
          }
          try {
            const release = await getRelease();
            core.setOutput('upload_url', release.upload_url);
            core.setOutput('release_id', release.id);
          } catch (error) {
            if (error.status !== 404) throw error;
            try {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Release ${tag}`,
                draft: false,
                prerelease: false,
              });
              core.setOutput('upload_url', data.upload_url);
              core.setOutput('release_id', data.id);
            } catch (createError) {
              if (createError.status !== 422) throw createError;
              const release = await getRelease();
              core.setOutput('upload_url', release.upload_url);
              core.setOutput('release_id', release.id);
            }
          }

    - name: Upload release assets
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs').promises;
          const path = require('path');
          const uploadUrl = '${{ steps.release.outputs.upload_url }}';
          const releaseId = Number('${{ steps.release.outputs.release_id }}');
          const { data: assets } = await github.rest.repos.listReleaseAssets({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: releaseId,
            per_page: 100,
          });
          const existing = new Map(assets.map((asset) => [asset.name, asset.id]));
          for (const file of await fs.readdir('./dist')) {
            const fullPath = path.join('./dist', file);
            if (!(await fs.stat(fullPath)).isFile()) continue;
            if (existing.has(file)) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.get(file),
              });
            }
            console.log('uploading', file);
            await github.rest.repos.uploadReleaseAsset({
              url: uploadUrl,
              name: file,
              data: await fs.readFile(fullPath),
            });
          }
