name: Reflow Linux profiles

on:
  workflow_call:

jobs:
  linux:
    name: Linux ${{ matrix.arch }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    env:
      REFLOW_GO_IMAGE: golang:1.26.9-bookworm
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armv7]
        profile: [platform, pcap, dpdk, pfring]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            goarch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            goarch: arm64
          - arch: armv7
            runner: ubuntu-24.04
            platform: linux/arm/v7
            goarch: arm
            goarm: '7'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
        if: matrix.arch == 'armv7'
        with:
          platforms: arm
      - name: Pull target build image
        id: image
        run: |
          docker pull --platform '${{ matrix.platform }}' "$REFLOW_GO_IMAGE"
          image_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$REFLOW_GO_IMAGE")
          echo "id=${image_digest##*@sha256:}" >> "$GITHUB_OUTPUT"
      - name: Cache capture SDK
        id: sdk-cache
        if: matrix.profile == 'dpdk' || matrix.profile == 'pfring'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/reflow-sdk
          key: reflow-sdk-v1-${{ matrix.arch }}-${{ matrix.profile }}-${{ steps.image.outputs.id }}-${{ hashFiles('scripts/reflow-build-linux.sh', '.github/workflows/reflow-linux.yml') }}
      - name: Build and test target profile
        env:
          REFLOW_PROFILE: ${{ matrix.profile }}
          REFLOW_SDK_CACHE_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
        run: |
          mkdir -p "$RUNNER_TEMP/reflow-sdk"
          docker run --rm --platform '${{ matrix.platform }}' \
            -v "$PWD:/src" -w /src \
            -v "$RUNNER_TEMP/reflow-sdk:/opt/reflow-sdk" \
            -e GOARCH='${{ matrix.goarch }}' -e GOARM='${{ matrix.goarm }}' \
            -e REFLOW_PROFILE="$REFLOW_PROFILE" \
            -e REFLOW_SDK_CACHE_HIT="$REFLOW_SDK_CACHE_HIT" \
            "$REFLOW_GO_IMAGE" bash scripts/reflow-build-linux.sh
      - name: Privileged platform integration with race detection
        if: matrix.arch == 'amd64' && matrix.profile == 'platform'
        run: |
          docker run --rm --cap-add NET_RAW --cap-add NET_ADMIN \
            --cap-add BPF --cap-add PERFMON --security-opt seccomp=unconfined \
            -v "$PWD:/src:ro" -w /src \
            -e GOTOOLCHAIN=local -e CGO_ENABLED=1 \
            -e REFLOW_CAPTURE_INTEGRATION=1 -e REFLOW_XDP_INTEGRATION=1 \
            -e REFLOW_EBPF_INTEGRATION=1 \
            -e REFLOW_NFLOG_INTEGRATION=1 \
            -e REFLOW_PSAMPLE_INTEGRATION=1 \
            "$REFLOW_GO_IMAGE" bash -euc '
              apt-get update -qq
              apt-get install -y --no-install-recommends nftables iproute2
              nft add table inet reflow_test
              nft add chain inet reflow_test output "{ type filter hook output priority 0; policy accept; }"
              nft add rule inet reflow_test output log group 42 snaplen 65535
              tc qdisc add dev lo clsact
              tc filter add dev lo egress matchall action sample rate 1 group 7 trunc 128
              go test -race -v ./pkg/reflow/source/capture ./pkg/reflow/source/afpacket ./pkg/reflow/source/xdp ./pkg/reflow/source/ebpf ./pkg/reflow/source/nflog ./pkg/reflow/source/psample
            '
      - uses: actions/upload-artifact@v6
        with:
          name: reflow-linux-${{ matrix.arch }}-${{ matrix.profile }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.dependencies.txt
          if-no-files-found: error
          retention-days: 14
