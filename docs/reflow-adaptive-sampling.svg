<svg xmlns="http://www.w3.org/2000/svg" width="780" height="395" viewBox="0 0 780 395" role="img" aria-labelledby="title description">
  <title id="title">Adaptive capture sampling decisions</title>
  <desc id="description">Every interval, read capture delivery drops and selected packet activity. Drops above the threshold multiply the divisor up to max_every and restart recovery. Drops can continue at the cap and still count as capture loss. At or below the threshold, an idle interval holds the divisor and clears the recovery timer. An active interval holds the divisor until the recovery window elapses, then divides it down to min_every and restarts the timer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#64748b"/>
    </marker>
    <style>
      text { font: 15px system-ui, sans-serif; fill: #17283c; }
      .title { font-size: 21px; font-weight: 650; }
      .action { font-size: 18px; font-weight: 650; }
      .condition { font-size: 14px; font-weight: 600; }
      .detail { font-size: 14px; fill: #41556d; }
      .connector { fill: none; stroke: #64748b; stroke-width: 1.5; }
      .arrow { marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="780" height="395" rx="16" fill="#f8fafc"/>
  <rect x="170" y="16" width="440" height="94" rx="12" fill="#eaf2ff" stroke="#b9cdeb"/>
  <g text-anchor="middle">
    <text class="title" x="390" y="46">Check capture statistics</text>
    <text x="390" y="72">Read delivery drops and selected packet activity</text>
    <text class="detail" x="390" y="94">Every interval_ms (default 1 s)</text>
  </g>

  <path class="connector" d="M390 110v24M138 134h504"/>
  <path class="connector arrow" d="M138 134v23"/>
  <path class="connector arrow" d="M390 134v23"/>
  <path class="connector arrow" d="M642 134v23"/>

  <rect x="16" y="160" width="244" height="193" rx="12" fill="#fff5e7" stroke="#edc893"/>
  <text class="condition" x="29" y="185">Drops &gt; drop_threshold</text>
  <text class="action" x="29" y="219">Increase divisor</text>
  <text x="29" y="245">Multiply by increase_factor</text>
  <text x="29" y="267">Clamp to max_every</text>
  <text class="detail" x="29" y="293">Restart the recovery timer</text>
  <path d="M29 306h218" stroke="#edc893"/>
  <text class="detail" x="29" y="326">At the cap, hold the divisor</text>
  <text class="detail" x="29" y="344">Keep counting delivery drops</text>

  <rect x="268" y="160" width="244" height="193" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text class="condition" x="281" y="185">Drops ≤ drop_threshold</text>
  <text class="detail" x="281" y="205">No selected packet activity</text>
  <text class="action" x="281" y="238">Hold divisor</text>
  <text x="281" y="264">Clear the recovery timer</text>

  <rect x="520" y="160" width="244" height="193" rx="12" fill="#ecf7f2" stroke="#a6cdb9"/>
  <text class="condition" x="533" y="185">Drops ≤ drop_threshold</text>
  <text class="detail" x="533" y="205">Selected packet activity</text>
  <text class="action" x="533" y="238">Recover gradually</text>
  <text x="533" y="264">Hold until recovery_after_ms</text>
  <text x="533" y="286">Divide by decrease_factor</text>
  <text x="533" y="308">Clamp to min_every</text>
  <text class="detail" x="533" y="331">Restart the recovery timer</text>

  <text class="detail" text-anchor="middle" x="390" y="379">A divisor of N selects about 1 in N packets.</text>
</svg>
