{{- if not .Values.clickhouse.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goflow2.fullname" . }}-clickhouse
  labels:
    {{- include "goflow2.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.clickhouse.auth.passwordKey }}: {{ required "Set clickhouse.auth.password or clickhouse.auth.existingSecret" .Values.clickhouse.auth.password | b64enc | quote }}
{{- end }}
