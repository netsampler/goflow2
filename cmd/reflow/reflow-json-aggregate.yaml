# Accept ReFlow-native JSON over UDP, aggregate it, and print the rolled-up result.

sources:
  - network: udp
    address: ":18082"
    type: json
    json:
      flavor: reflow

processor:
  type: builtin
  workers: 2
  builtin:
    drop_message: true
    drop_payload: false

aggregators:
  - enabled: true
    stream: flow_data
    # Window flush exports a bucket when it has been idle for the configured time.
    window:
      idle_flush_after_ms: 10000
    # Periodic snapshots export the current state even if a bucket stays open.
    periodic:
      every_ms: 60000
    template_id: 256
    # `fields` is ordered. Entries use role:name[:modifier], except static:name:value.
    # key forms the bucket key, sum adds numeric counters, first keeps the first value,
    # current keeps the latest value, and static injects a configured constant.
    fields:
      - key:src_addr
      - key:dst_addr
      - key:proto
      - key:src_port
      - key:dst_port
      - sum:bytes
      - sum:packets
      - first:start_time_unix
      - current:agent_ip
      - current:end_time_unix
      - current:sampling_rate
      - static:exporter_name:reflow-example

encoder:
  type: json
  workers: 1
  tflow_data:
    # This section still matters for schema-aware encoders even though this example emits JSON.
    # If omitted or empty, all fields produced by aggregation are eligible for export.
    fields_path: reflow-ipfix-fields.yaml
    overrides:
      src_addr:
        name: sourceIPv4Address
        id: 8
        length: 4
        type: ipv4Address
        netflow_v9_id: 8

sink:
  type: stdout
