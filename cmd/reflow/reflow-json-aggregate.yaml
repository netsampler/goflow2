source:
  network: udp
  address: ":18082"
  type: json
  json:
    flavor: reflow

processor:
  type: builtin
  workers: 2
  builtin:
    drop_message: true
    drop_payload: false

aggregator:
  type: flowstore_window
  flush_interval_ms: 10000
  key_fields:
    - src_addr
    - dst_addr
    - proto
    - src_port
    - dst_port

encoder:
  type: json
  workers: 1

sink:
  type: stdout
