source:
  network: udp
  address: ":18081"
  frame: datagram
  message_type: json_raw_packet_header

processor:
  type: builtin
  workers: 4
  builtin:
    drop_message: false

encoder:
  type: sflow
  # Batching is per encoder worker. Keep this at 1 when you want stronger
  # packing and more multi-sample sFlow datagrams.
  workers: 1
  max_datagram_bytes: 1400
  batch:
    enabled: true
    max_records: 8
    max_bytes: 1200
    flush_interval_ms: 4000

sink:
  type: udp
  address: "127.0.0.1:6343"
