# Accept ReFlow-native JSON over UDP, aggregate encapsulated flows by outer and
# inner tuple fields derived from packet.layers, and print aggregate JSON snapshots.
#
# Manual test:
#   go run ./cmd/reflow -config cmd/reflow/reflow-json-nested-aggregate.yaml
#   nc -u -w0 127.0.0.1 18084 < cmd/reflow/nested-ip-layers.json
#   nc -u -w0 127.0.0.1 18084 < cmd/reflow/nested-dot1q-mpls-gre.json
#
# The periodic exporter prints the open bucket every second; Ctrl-C also flushes
# any remaining aggregate state.

sources:
  - network: udp
    address: ":18084"
    type: json
    json:
      flavor: reflow

processor:
  type: builtin
  workers: 1
  builtin:
    drop_message: true
    drop_payload: true

aggregators:
  - stream: nested_flow_data
    window:
      idle_flush_after_ms: 5000
    periodic:
      every_ms: 1000
    key_fields:
      - outer_src_addr
      - outer_dst_addr
      - src_addr
      - dst_addr
      - proto
      - src_port
      - dst_port
    template_id: 300
    static_fields:
      example: nested-ip-layers
    sum:
      - bytes
      - packets
    first:
      - agent_ip
      - start_time_unix
    current:
      - agent_ip
      - input_if
      - output_if
      - sampling_rate
      - end_time_unix

encoder:
  type: json
  workers: 1
  json:
    flavor: canonical

sink:
  type: stdout
